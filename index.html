<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Joker-XD CORE v2.0.2 — Premium Pairing — Pairing Locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ff2d55;--orange:#ff9f0a;--green:#25d366;--green2:#128c7e;
  --bg:#050508;--card:#0e0e14;--line:#1e1e2a;--muted:#8a8a9a;
}
body{
  min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(255,45,85,.18),transparent 55%),
    radial-gradient(900px 500px at 100% 0%,rgba(255,159,10,.12),transparent 50%),
    radial-gradient(800px 400px at 50% 120%,rgba(37,211,102,.08),transparent 45%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.wrap{width:min(440px,100%);position:relative}
.glow{
  position:absolute;inset:-2px;border-radius:28px;
  background:linear-gradient(135deg,var(--pink),var(--orange),var(--green));
  filter:blur(18px);opacity:.35;z-index:0;animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.28}50%{opacity:.45}}
.card{
  position:relative;z-index:1;background:linear-gradient(165deg,#12121a 0%,#0a0a10 100%);
  border:1px solid var(--line);border-radius:26px;padding:36px 28px 28px;
  box-shadow:0 25px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--green));
}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--orange);
  background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.25);
  padding:5px 12px;border-radius:999px;margin-bottom:16px;
}
.logo{
  font-family:Orbitron,sans-serif;font-size:28px;font-weight:700;line-height:1.15;
  background:linear-gradient(90deg,var(--pink),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;
}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}
label{display:block;font-size:12px;font-weight:600;color:#b0b0c0;margin-bottom:8px;letter-spacing:.3px}
.input-wrap{position:relative;margin-bottom:14px}
.input-wrap span{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;color:#666;pointer-events:none;
}
input{
  width:100%;padding:15px 16px 15px 42px;border-radius:14px;border:1px solid #252533;
  background:#16161f;color:#fff;font-size:16px;outline:none;transition:.2s;
}
input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
input::placeholder{color:#555}
.btn{
  width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;font-size:15px;
  font-weight:700;letter-spacing:.4px;color:#fff;
  background:linear-gradient(90deg,var(--green),var(--green2));
  box-shadow:0 8px 24px rgba(37,211,102,.25);transition:.2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(37,211,102,.35)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.code-box{
  margin:20px 0 10px;min-height:52px;display:flex;align-items:center;justify-content:center;
  background:#0a0a12;border:1px dashed #2a2a3a;border-radius:14px;padding:12px;
}
#code{
  font-family:Orbitron,monospace;font-size:28px;letter-spacing:8px;font-weight:700;
  color:var(--green);text-align:center;word-break:break-all;
}
.copy-btn{
  display:none;width:100%;padding:13px;border:0;border-radius:14px;cursor:pointer;
  font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--orange));
  margin-top:8px;box-shadow:0 8px 22px rgba(255,45,85,.2);
}
.copy-btn.show{display:block}
#status{color:var(--muted);font-size:13px;margin-top:14px;min-height:20px;text-align:center}
.hint{
  margin-top:22px;padding-top:16px;border-top:1px solid #1a1a24;
  color:#666;font-size:12px;line-height:1.55;text-align:center;
}
.hint strong{color:#999}
.ver{margin-top:14px;text-align:center;font-size:11px;color:#444;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="card">
    <div class="badge">✦ PREMIUM PORTAL</div>
    <div class="logo">🃏 JOKER-XD</div>
    <p class="sub">Multi-Device Pairing · v2.0.2</p>

    <label for="number">WhatsApp Number</label>
    <div class="input-wrap">
      <span>📱</span>
      <input id="number" placeholder="92XXXXXXXXXX" inputmode="numeric" autocomplete="tel">
    </div>

    <button class="btn" id="pairBtn" onclick="pair()">Get Pairing Code</button>

    <div class="code-box"><div id="code"></div></div>
    <button id="copyBtn" class="copy-btn" onclick="copyCode()">📋 Copy Pairing Code</button>
    <p id="status"></p>

    <div class="hint">
      <strong>How to link</strong><br>
      WhatsApp → Linked devices → Link a device<br>
      → <strong>Link with phone number</strong> → enter code
    </div>
    <div class="ver">JOKER-XD v2.0.2 · Zain Marten Joker</div>
  </div>
</div>
<script>
async function pair(){
  const n=document.getElementById("number").value.trim().replace(/\D/g,"");
  const status=document.getElementById("status");
  const code=document.getElementById("code");
  const btn=document.getElementById("pairBtn");
  const copyBtn=document.getElementById("copyBtn");
  code.textContent="";
  copyBtn.classList.remove("show");
  if(!n || n.length < 10){
    status.textContent="⚠️ Enter a valid number with country code";
    return;
  }
  status.textContent="⏳ Generating pairing code...";
  btn.disabled=true;
  try{
    const r=await fetch("/pair?number="+encodeURIComponent(n));
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Request failed");
    code.textContent=data.code||"";
    copyBtn.classList.toggle("show", !!data.code);
    status.textContent=data.message||"✅ Use this code in WhatsApp within 60s";
  }catch(e){
    status.textContent="❌ "+(e.message||"Failed");
  }finally{
    btn.disabled=false;
  }
}
async function copyCode(){
  const code=document.getElementById("code").textContent.trim();
  const status=document.getElementById("status");
  if(!code) return;
  try{
    await navigator.clipboard.writeText(code);
    status.textContent="✅ Pairing code copied!";
  }catch(e){
    const area=document.createElement("textarea");
    area.value=code;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    status.textContent="✅ Pairing code copied!";
  }
}
document.getElementById("number").addEventListener("keydown",e=>{
  if(e.key==="Enter") pair();
});
</script>
</body>
</html>
